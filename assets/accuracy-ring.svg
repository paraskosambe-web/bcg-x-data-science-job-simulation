<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Random Forest Classifier, approximately 90 percent overall test accuracy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042a1f"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29ba74"/>
      <stop offset="100%" stop-color="#b7f0cd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="200" rx="18" fill="url(#bg)"/>

  <!-- ring track -->
  <circle cx="105" cy="100" r="62" fill="none" stroke="#0b3d2e" stroke-width="14"/>

  <!-- ring progress (90%) -->
  <circle cx="105" cy="100" r="62" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" pathLength="100" transform="rotate(-90 105 100)" filter="url(#glow)" stroke-dasharray="0 100">
    <animate attributeName="stroke-dasharray" values="0 100;90 100;90 100" keyTimes="0;0.3;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- centre text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="105" y="108" fill="#ffffff" font-size="34" font-weight="800">~90%</text>
    <text x="105" y="128" fill="#8fd9b0" font-size="10" letter-spacing="2">ACCURACY</text>
  </g>

  <!-- right side labels -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="205" y="82" fill="#8fd9b0" font-size="11" letter-spacing="2">MODEL</text>
    <text x="205" y="108" fill="#ffffff" font-size="22" font-weight="700">Random Forest Classifier</text>
    <text x="205" y="134" fill="#b7f0cd" font-size="13">~90% overall test accuracy</text>
  </g>

  <!-- subtle pulse accent -->
  <circle cx="105" cy="100" r="78" fill="none" stroke="#29ba74" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="76;88;76" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
