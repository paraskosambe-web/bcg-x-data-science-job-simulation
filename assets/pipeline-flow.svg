<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="Animated data pipeline: raw input, cleaned, feature engineered, model ready" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042a1f"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29ba74"/>
      <stop offset="100%" stop-color="#b7f0cd"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="160" rx="18" fill="url(#bg)"/>

  <!-- floating data particles -->
  <g fill="#b7f0cd">
    <circle cx="90" cy="150" r="2" opacity="0.5"><animate attributeName="cy" values="150;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="150" r="1.6" opacity="0.5"><animate attributeName="cy" values="150;10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="150" r="2.2" opacity="0.5"><animate attributeName="cy" values="150;10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="150" r="1.7" opacity="0.5"><animate attributeName="cy" values="150;10" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="150" r="2" opacity="0.5"><animate attributeName="cy" values="150;10" dur="8.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- guide path for the data dot -->
  <path id="flow" d="M 112 80 L 787 80" fill="none" stroke="none"/>

  <!-- connectors -->
  <g stroke="#29ba74" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6">
    <line x1="203" y1="80" x2="247" y2="80"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="428" y1="80" x2="472" y2="80"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="653" y1="80" x2="697" y2="80"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#29ba74">
    <polygon points="249,80 241,75 241,85"/>
    <polygon points="474,80 466,75 466,85"/>
    <polygon points="699,80 691,75 691,85"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- node 1 -->
    <rect x="27" y="38" width="170" height="84" rx="12" fill="#0b3d2e" stroke="#177b57" stroke-width="1.5"/>
    <rect x="27" y="38" width="170" height="84" rx="12" fill="none" stroke="#b7f0cd" stroke-width="2.5" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.18;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="112" y="64" fill="#e8f8ef" font-size="12" font-weight="700" letter-spacing="0.8">RAW INPUT</text>
    <text x="112" y="86" fill="#8fd9b0" font-size="10">client_data.csv</text>
    <text x="112" y="101" fill="#8fd9b0" font-size="10">price_data.csv</text>

    <!-- node 2 -->
    <rect x="252" y="38" width="170" height="84" rx="12" fill="#0b3d2e" stroke="#177b57" stroke-width="1.5"/>
    <rect x="252" y="38" width="170" height="84" rx="12" fill="none" stroke="#b7f0cd" stroke-width="2.5" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.18;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="337" y="64" fill="#e8f8ef" font-size="12" font-weight="700" letter-spacing="0.8">CLEANED</text>
    <text x="337" y="92" fill="#8fd9b0" font-size="10">clean_data_after_eda.csv</text>

    <!-- node 3 -->
    <rect x="477" y="38" width="170" height="84" rx="12" fill="#0b3d2e" stroke="#177b57" stroke-width="1.5"/>
    <rect x="477" y="38" width="170" height="84" rx="12" fill="none" stroke="#b7f0cd" stroke-width="2.5" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.18;1" dur="8s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="562" y="64" fill="#e8f8ef" font-size="12" font-weight="700" letter-spacing="0.3">FEATURE ENGINEERED</text>
    <text x="562" y="92" fill="#8fd9b0" font-size="10">clean_data_engineering.csv</text>

    <!-- node 4 -->
    <rect x="702" y="38" width="170" height="84" rx="12" fill="#177b57" stroke="#29ba74" stroke-width="1.5"/>
    <rect x="702" y="38" width="170" height="84" rx="12" fill="none" stroke="#b7f0cd" stroke-width="2.5" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.18;1" dur="8s" begin="6s" repeatCount="indefinite"/>
    </rect>
    <text x="787" y="64" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.8">MODEL READY</text>
    <text x="787" y="92" fill="#d6f5e3" font-size="10">data_for_prediction.csv</text>
  </g>

  <!-- progress bar -->
  <rect x="27" y="140" width="845" height="4" rx="2" fill="#0b3d2e"/>
  <rect x="27" y="140" width="845" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="width" values="0;845;845" keyTimes="0;0.75;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- data dot -->
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear">
      <mpath href="#flow"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.75;0.78;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
